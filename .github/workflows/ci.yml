name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate, build, and package
        run: npm run package

      - name: Upload browser packages
        uses: actions/upload-artifact@v4
        with:
          name: vtop-modern-extension-${{ github.sha }}
          path: |
            .output/*-chrome.zip
            .output/*-firefox.zip
          if-no-files-found: error
